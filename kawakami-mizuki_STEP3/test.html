<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>TNG CAFE</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>

    <!-- ヘッダー (緑の背景の帯) -->
    <header class="site-header">
        <h2>TNG CAFE</h2>
        <p class="header-catch">心安らぐ一杯をあなたに</p>
        <nav class="header-nav">
            <a href="#about">About Us</a>
            <a href="#menu">Menu</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>

    <!-- メインコンテンツ -->
    <main class="main-content">

        <!-- About Us セクション -->
        <section id="About" class="section-about">
            <h2>About Us</h2>
            <p>TNGCafeは自然の香りに包まれたリラックス空間を提供しています。<br>自家焙煎コーヒーと手づくりスイーツで、穏やかな時間をお過ごしください。</p>
            <div class="About-img-placeholder">☕カフェの写真</div>
        </section>

        <!-- Menu セクション -->
        <section id="menu" class="section-menu">
            <h2>Menu</h2>
            <div class="menu-grid">
                <div class="menu-item">
                    <span>☕コーヒー</span>
                    <p>ブレンドコーヒー</p>
                </div>
                <div class="menu-item">
                    <span>🍰ケーキ</span>
                    <p>ベイクドチーズケーキ</p>
                </div>
                <div class="menu-item">
                    <span>🥛ラテ</span>
                    <p>カフェラテ</p>
                </div>
            </div>
        </section>

        <!-- Contact セクション -->
        <section id="contact" class="section-contact">
            <h2>Contact</h2>
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">お名前:</label>
                    <input type="text" id="name">
                </div>
                <div class="form-group">
                    <label for="email">メールアドレス:</label>
                    <input type="email" id="email">
                </div>
                <div class="form-group">
                    <label for="message">お問い合わせ内容:</label>
                    <textarea id="message" rows="4"></textarea>
                </div>
                <button type="submit" class="submit-btn">送信</button>
            </form>
        </section>

    </main>

    <!-- フッター （緑の背景の帯）-->
    <footer class="site-footer">
        <p>&copy; 20○○ TNG Cafe</p>
    </footer>

</body>
</html>
